# Versión de la app (MAJOR.MINOR.PATCH). No editar a mano: usar scripts/bump-version.sh
#   patch -> actualización menor (1.0.1 -> 1.0.2)
#   minor -> actualización mayor (1.0.2 -> 1.1.0)
#   major -> solo cuando se decida pasar a 2.x (1.4.3 -> 2.0.0)
# VERSION_CODE sube en 1 con cada cambio de versión (Android lo exige para actualizar).
VERSION_MAJOR=1
VERSION_MINOR=1
VERSION_PATCH=0
VERSION_CODE=20
